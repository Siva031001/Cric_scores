<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CricketScorer — Live Overlay</title>
  <style>
    /* Transparent end-to-end: OBS's Browser Source composites whatever the
       page's own background is, so html/body/#root must never paint an
       opaque color of their own, or the camera feed behind it in OBS would
       be hidden. No scrollbars either — an OBS source is a fixed canvas,
       not a scrollable page. */
    html, body, #root {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
